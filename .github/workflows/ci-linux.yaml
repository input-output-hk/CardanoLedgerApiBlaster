name: ci-linux

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ staging, main ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  LEAN_VERSION: "4.24.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CardanoLedgerApiBlaster

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: CardanoLedgerApiBlaster
      - name: Checkout coordinated Blaster
        uses: actions/checkout@v6
        with:
          repository: input-output-hk/Lean-blaster
          ref: bc03bb402ce702984875bbf8ba51216bd6f843d7
          path: Lean-blaster
      - name: Checkout coordinated Core
        uses: actions/checkout@v6
        with:
          repository: input-output-hk/PlutusCoreBlaster
          ref: 2246f54c4341f8e1b90044d80e0022746433c791
          path: PlutusCoreBlaster
      - name: Setup Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "/home/runner/.elan/bin" >> $GITHUB_PATH
          chmod +x /home/runner/.elan/bin/*

      - name: Fix Elan version
        run: |
          elan toolchain install ${{ env.LEAN_VERSION }}
          elan default ${{ env.LEAN_VERSION }}

      - uses: actions/cache@v4
        id: solver
        with:
          path: ${{ runner.temp }}/assurance-z3
          key: assurance-z3-${{ runner.os }}-${{ hashFiles('Lean-blaster/scripts/build-assurance-z3.sh') }}
      - name: Build compatible solver
        if: steps.solver.outputs.cache-hit != 'true'
        run: bash ../Lean-blaster/scripts/build-assurance-z3.sh "$RUNNER_TEMP/assurance-z3"
      - name: Select solver
        run: echo "$RUNNER_TEMP/assurance-z3/bin" >> "$GITHUB_PATH"

      - name: Tools version
        run: |
          elan --version
          lake --version
          lean --version
          z3 --version

      - name: Build and Validate CardanoLedgerApi
        run: make check_cardano_ledger_api

      - name: Upload CardanoLedgerApi build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cardano-ledger-api-build
          path: CardanoLedgerApiBlaster/build.log

      - name: Check Auction proofs and HelloWorld compilation
        timeout-minutes: 20
        run: lake build Tests.Scripts.Auction.Properties Tests.Scripts.HelloWorld.HelloWorld

  legacy-tests:
    # The assurance solver's recfun-finder path makes unrelated legacy proofs
    # take hours. Keep their full coverage on the earlier Core/Blaster revisions
    # with the released Z3 version used for local validation.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: CardanoLedgerApiBlaster
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: CardanoLedgerApiBlaster
      - name: Checkout legacy Blaster
        uses: actions/checkout@v6
        with:
          repository: input-output-hk/Lean-blaster
          ref: bafdd4f7976037cd7bd8e443df04af096dc5b96e
          path: Lean-blaster
      - name: Checkout legacy Core
        uses: actions/checkout@v6
        with:
          repository: input-output-hk/PlutusCoreBlaster
          ref: 41fe7eadf460dc66bef22b85656bc36408638bdc
          path: PlutusCoreBlaster
      - name: Setup Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "/home/runner/.elan/bin" >> "$GITHUB_PATH"
      - name: Fix Elan version
        run: |
          elan toolchain install "${{ env.LEAN_VERSION }}"
          elan default "${{ env.LEAN_VERSION }}"
      - name: Install released Z3
        run: |
          cd /home/runner
          wget -q https://github.com/Z3Prover/z3/releases/download/z3-4.15.4/z3-4.15.4-x64-glibc-2.39.zip
          unzip -q z3-4.15.4-x64-glibc-2.39.zip
          echo "/home/runner/z3-4.15.4-x64-glibc-2.39/bin" >> "$GITHUB_PATH"
      - name: Execute and Validate Tests
        timeout-minutes: 30
        run: make check_tests
      - name: Upload Tests log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tests-build
          path: CardanoLedgerApiBlaster/build.log
